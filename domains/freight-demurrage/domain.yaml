name: freight-demurrage
label_col: demurrage_risk
secondary_label_col: blank_sailing
group_col: vessel_id
time_col: event_ts
text_cols: [terminal_note, weather_alert]
high_card_cols: [bol_id, container_id, pol, pod]
id_col: container_id
data_path: domains/freight-demurrage/data/containers.csv
feature_exclude: []
action_thresholds:
  high: 0.78
  mid_high: 0.65
  mid: 0.50
  mid_low: 0.40
actions:
  high: divert
  mid_high: rebook
  mid: expedite
  mid_low: authorize_fee
  low: monitor
playbook:
  - action: cancel_booking
    min_proba: 0.35
    when_col: cargo_vs_fee_collapse
    when_equals: "1"
    reason: "This shipment's cargo is worth less than the late fee it is likely to run up, so cancelling the booking loses less money than paying the fee."
  - action: divert
    min_proba: 0.78
    reason: "Very likely to sit past its free days (the days before late fees start) at this terminal; sending it to another terminal avoids the fee."
  - action: rebook
    min_proba: 0.55
    when_col: blank_sailing
    when_equals: "1"
    reason: "Its ship sailing was cancelled and the late-fee risk is high, so book it on the next ship."
  - action: expedite
    min_proba: 0.45
    when_col: inland_can_beat_freedays
    when_equals: "1"
    reason: "A faster truck or rail move can still get it out before its free days run out."
  - action: authorize_fee
    min_proba: 0.35
    when_col: fee_inevitable
    when_equals: "1"
    reason: "The fee is close to certain; approving it now is cheaper than a surprise invoice later."
  - action: monitor
    min_proba: 0.0
    reason: "Risk is low enough to leave it on the normal path for now."
disclaimer: "Synthetic / public-derived ocean freight demo only. Not a carrier system of record, not customs advice, not production routing."
