<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in · Freight Money Desk</title>
<link rel="stylesheet" href="/static/saas_shell.css"/>
<link rel="stylesheet" href="/static/saas_density.css"/>
</head>
<body class="app-shell">
<div class="login-stage">
  <div class="login-card">
    <div class="mark" style="display:flex;align-items:center;gap:.55rem;margin-bottom:.85rem">
      <div class="mark-orb" style="width:1.7rem;height:1.7rem;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#22d3ee)"></div>
      <strong>Freight Money Desk</strong>
    </div>
    <p class="eyebrow">Shipper late-fee ops</p>
    <h1>Sign in to your desks</h1>
    <p class="lede">Same TabPFN engine judges will score — demo SaaS shell, not production IAM.</p>
    <div class="hint">Demo credentials: <code>demo</code> / <code>demurrage</code></div>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="username">Work email / user</label>
      <input id="username" name="username" autocomplete="username" placeholder="demo" required/>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required/>
      <button type="submit">Continue</button>
    </form>
  </div>
</div>
</body>
</html>
