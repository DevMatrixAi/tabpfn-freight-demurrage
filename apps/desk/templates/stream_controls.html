<link rel="stylesheet" href="/static/stream_board.css" />
<div class="stream-panel" id="stream-panel">
  <div class="stream-controls">
    <label class="muted" for="stream-mode">Stream mode</label>
    <select id="stream-mode" name="stream-mode">
      {% set sel = state.requested_mode or 'mock' %}
      <option value="mock" {% if sel == 'mock' %}selected{% endif %}>Mock</option>
      <option value="plus" {% if sel == 'plus' %}selected{% endif %}>Plus</option>
      <option value="thinking" {% if sel == 'thinking' %}selected{% endif %}>Thinking</option>
    </select>
    <button type="button" id="btn-stream-rescore" class="stream-btn">Stream event + re-score</button>
    <label class="muted stream-auto-label"><input type="checkbox" id="stream-auto" /> Auto-poll (5s)</label>
  </div>
  <p class="muted stream-hint">Appends a synthetic Terminal49 / project44 / EDI sample row, then re-runs triage and refreshes risk cards — no full page reload.</p>
  <div id="stream-status" class="stream-status" aria-live="polite"></div>
</div>
<script>
(function(){
  var btn = document.getElementById('btn-stream-rescore');
  var auto = document.getElementById('stream-auto');
  var modeSel = document.getElementById('stream-mode');
  var timer = null;
  function syncTicker(root){
    if(!root) return;
    var dollars = document.querySelector('.ticker .dollars, .dollars');
    var d = root.getAttribute('data-demurrage') || root.getAttribute('data-demurrage-total');
    if(dollars && d != null){
      try { dollars.textContent = '$' + Number(d).toLocaleString('en-US', {maximumFractionDigits:0}); } catch(e) {}
    }
  }
  async function streamRescore(){
    if(!btn) return;
    btn.disabled = true;
    btn.textContent = 'Streaming…';
    try {
      var mode = (modeSel && modeSel.value) || 'mock';
      var body = new URLSearchParams({mode: mode, count: '1', partial: '1'});
      var res = await fetch('/stream-rescore', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/html'},
        body: body.toString(),
        credentials: 'same-origin'
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();
      var tmp = document.createElement('div');
      tmp.innerHTML = html;
      var neu = tmp.querySelector('#live-board') || tmp.querySelector('#risk-board') || tmp.firstElementChild;
      var cur = document.getElementById('live-board') || document.getElementById('risk-board');
      if(cur && neu){ cur.replaceWith(neu); }
      syncTicker(document.getElementById('live-board') || document.getElementById('risk-board'));
      var st = document.getElementById('stream-status');
      if(st) st.textContent = 'Re-scored at ' + new Date().toLocaleTimeString();
    } catch (err) {
      var st = document.getElementById('stream-status');
      if(st) st.innerHTML = '<span class="warn-banner">Stream re-score failed: ' + err.message + '</span>';
    } finally {
      if(btn){ btn.disabled = false; btn.textContent = 'Stream event + re-score'; }
    }
  }
  if(btn) btn.addEventListener('click', streamRescore);
  if(auto) auto.addEventListener('change', function(){
    if(timer){ clearInterval(timer); timer = null; }
    if(auto.checked){ timer = setInterval(streamRescore, 5000); streamRescore(); }
  });
})();
</script>
