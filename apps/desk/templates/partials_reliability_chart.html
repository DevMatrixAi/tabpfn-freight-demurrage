{# Visual reliability diagram from calibration bins (mean p vs mean y). #}
{% if result is defined and result.calibration and result.calibration.bins %}
<figure class="card" id="eval-reliability-chart" data-reliability-chart="1" style="margin:0 0 .85rem;padding:.85rem;background:var(--panel2)">
  <figcaption style="margin:0 0 .5rem;font-size:.85rem;font-weight:650">Reliability diagram</figcaption>
  <p class="muted" style="margin:0 0 .65rem;font-size:.75rem">Points = bin mean predicted probability vs observed rate. Diagonal = perfect calibration.</p>
  <svg viewBox="0 0 340 340" width="100%" style="max-width:340px;height:auto;display:block" role="img" aria-label="Reliability diagram">
    <rect x="40" y="20" width="280" height="280" fill="#0b1220" stroke="#243044"/>
    {# Perfect calibration diagonal #}
    <line x1="40" y1="300" x2="320" y2="20" stroke="#334155" stroke-dasharray="4 3" stroke-width="1.5"/>
    {# Axes labels #}
    <text x="180" y="330" text-anchor="middle" fill="#9aa8bc" font-size="11">Mean predicted probability</text>
    <text x="14" y="160" text-anchor="middle" fill="#9aa8bc" font-size="11" transform="rotate(-90 14 160)">Observed rate</text>
    <text x="40" y="315" fill="#64748b" font-size="9">0</text>
    <text x="310" y="315" fill="#64748b" font-size="9">1</text>
    <text x="28" y="304" text-anchor="end" fill="#64748b" font-size="9">0</text>
    <text x="28" y="28" text-anchor="end" fill="#64748b" font-size="9">1</text>
    {% for b in result.calibration.bins %}
      {% if b.n and b.mean_proba is not none and b.mean_label is not none %}
      {% set cx = 40 + (b.mean_proba * 280) %}
      {% set cy = 300 - (b.mean_label * 280) %}
      {% set r = 6 %}
      <circle cx="{{ '%.1f'|format(cx) }}" cy="{{ '%.1f'|format(cy) }}" r="{{ '%.1f'|format(r) }}"
              fill="#3b82f6" fill-opacity="0.85" stroke="#93c5fd" stroke-width="1">
        <title>bin [{{ '%.2f'|format(b.lo) }}, {{ '%.2f'|format(b.hi) }}] n={{ b.n }} p={{ b.mean_proba }} y={{ b.mean_label }} gap={{ b.gap }}</title>
      </circle>
      {% endif %}
    {% endfor %}
  </svg>
  {% if result.calibration.ece is not none %}
  <p class="muted" style="margin:.5rem 0 0;font-size:.75rem">ECE {{ "%.4f"|format(result.calibration.ece) }}{% if result.calibration.brier is not none %} · Brier {{ "%.4f"|format(result.calibration.brier) }}{% endif %}</p>
  {% endif %}
</figure>
{% endif %}
