[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tabpfn-hack-core"
version = "0.1.0"
description = "Domain-agnostic TabPFN-3.5 MCP + CLI core for the Prior Labs hackathon (pluggable domain packs)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "tabpfn-hack-core contributors" }]
keywords = ["tabpfn", "mcp", "hackathon", "prior-labs", "tabular"]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "mcp>=1.2",
  "tabpfn-client>=0.6.0",
]

[project.optional-dependencies]
local = ["tabpfn>=9.0.0"]
explain = ["tabpfn-extensions>=0.1.0"]
baseline-xgb = ["xgboost>=2.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
tabpfn-hack = "tabpfn_hack_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tabpfn_hack_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
